# nginx.conf 파일 전체 구조
events {
    worker_connections 1024;
}

http {
    # 기본 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 로그 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # 업스트림 설정 (로드 밸런싱을 위한 백엔드 서버 정의)
    upstream pocamarket-web-dev {
        server pocamarket-web-dev:3000;
    }
    
    upstream pocamarket-api-dev {
        server pocamarket-api-dev:8080;
    }
    
    # HTTP 서버 블록 (인증서 발급용)
    server {
        listen 80;
        server_name pocamarket.co.kr www.pocamarket.co.kr localhost;

        # Certbot 인증을 위한 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # HTTP 요청을 HTTPS로 리디렉션 (인증서 발급 후 활성화)
        return 301 https://$host$request_uri;

        # 임시로 HTTP 요청도 처리 (인증서 발급 후 주석 처리)
        # location / {
        #     proxy_pass http://pocamarket-web-dev;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
        
        # location /api {
        #     rewrite ^/api/(.*) /$1 break;
        #     proxy_pass http://pocamarket-api-dev;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }

    # HTTPS 서버 블록 (인증서 발급 후 활성화)
    server {
        listen 443 ssl;
        server_name pocamarket.co.kr www.pocamarket.co.kr localhost;
    
        ssl_certificate /etc/ssl/certs/localhost+1.pem;
        ssl_certificate_key /etc/ssl/private/localhost+1-key.pem;
    
        # Next.js HMR을 위한 WebSocket 프록시 설정
        location /_next/webpack-hmr {
            proxy_pass http://pocamarket-web-dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    
        location / {
            proxy_pass http://pocamarket-web-dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 지원 헤더 추가
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        location /api {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://pocamarket-api-dev;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}